<title>foob M1 hand-written MathML controls</title>
<style>body { font: 22px/1.5 sans-serif; margin: 32px; background: #fffaf0; } math { font-size: 32px; } section { margin: 24px 0; }</style>
<h1>Hand-written MathML controls</h1>
<p>No converter or external assets. Inspect fraction bar, radical, scripts and matrix rows.</p>
<section>Fraction and radical:
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo><msqrt><mn>2</mn></msqrt></math></section>
<section>Scripts and summation:
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><msubsup><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><msup><mi>i</mi><mn>2</mn></msup></math></section>
<section>Two by two matrix:
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mo>(</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>)</mo></mrow></math></section>
